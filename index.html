<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fb;
    color:#111827;
    line-height:1.6;
  }

  img{max-width:100%;display:block;}

  .container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding-left:24px;
    padding-right:24px;
  }

  .hero{
    position:relative;
    min-height:760px;
    overflow:hidden;
    color:#fff;
  }

  .hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.68));
  }

  .hero-content{
    position:relative;
    z-index:2;
    min-height:760px;
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    padding:70px 0;
  }

  .hero-inner{
    max-width:800px;
    margin-left:0;
  }

  .badge{
    display:inline-block;
    padding:10px 16px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    font-size:13px;
    margin-bottom:22px;
  }

    font-size:72px;
    line-height:1;
    font-weight:800;
    margin-bottom:18px;
    letter-spacing:-2px;
  }

    font-size:20px;
    max-width:700px;
    color:rgba(255,255,255,.9);
    margin-bottom:28px;
  }

  .hero-actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:34px;
  }

  .hero-btn{
    display:inline-block;
    padding:15px 22px;
    border-radius:999px;
    background:#fff;
    color:#111827;
    font-weight:800;
    text-decoration:none;
  }

  .hero-btn.secondary{
    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(12px);
  }

  .stats{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:flex-start;
  }

  .stat-card{
    min-width:220px;
    padding:24px;
    border-radius:22px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
  }

  .stat-card h2{
    font-size:44px;
    line-height:1;
    margin-bottom:8px;
    font-weight:800;
  }

  .stat-card span{
    font-size:14px;
    color:rgba(255,255,255,.82);
  }

    padding:80px 0 20px;
  }

    max-width:1100px;
    margin:auto;
    padding-left:24px;
    padding-right:24px;
  }

  .message-intro{
    margin-bottom:40px;
  }

    display:inline-block;
    padding:10px 16px;
    border-radius:999px;
    background:#eef2ff;
    color:#4338ca;
    font-size:13px;
    font-weight:700;
    margin-bottom:18px;
  }

    line-height:1.05;
    margin-bottom:20px;
    letter-spacing:-1.5px;
  }

  .message-intro p{

    color:#4b5563;
    font-size:18px;
  }

    .hero-content{
      min-height:auto;
      padding:90px 0 50px;
    }

    h1{
      font-size:42px;
      line-height:1.05;
    }

    .hero-description{
      font-size:16px;
    }

    .message-intro h2{

    }

    .stat-card{
      width:100%;
    }

    .stat-card h2{
      font-size:36px;
